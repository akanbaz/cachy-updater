[project]
name = "cachy-updater"
version = "0.2.0"
description = "A stable GUI system updater for CachyOS with clear change summaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "akanbaz" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/akanbaz/cachy-updater"
Repository = "https://github.com/akanbaz/cachy-updater"

[project.scripts]
cachy-updater = "cachy_updater.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cachy_updater*"]
